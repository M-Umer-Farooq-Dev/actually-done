[package]
name = "actually-done"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Check Claude Code and Codex completion claims against Git, tests, and unfinished work"
readme = "README.md"
repository = "https://github.com/M-Umer-Farooq-Dev/actually-done"
keywords = ["cli", "codex", "claude", "verification"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/licenses/**", "/docs/agents.md", "/docs/case-study.md", "/docs/dependency-licenses.md", "/docs/distribution.md", "/docs/provenance.md", "/docs/publishing.md", "/docs/benchmarks/**", "/docs/decisions/**", "/skills/**", "/examples/**", "/tests/**", "/scripts/adoption_snapshot.py", "/scripts/build_site.py", "/scripts/demo.py", "/scripts/license_report.py", "/scripts/package_release.py", "/scripts/tests/test_distribution.py", "/site/**"]

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
same-file = "1"
tempfile = "3"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "actually-done"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
